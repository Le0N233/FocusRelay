name: Build FocusRelay for Windows
on:
  workflow_dispatch:
  push:
    paths: ['src/**', 'scripts/**', 'tests/**', '.github/workflows/build.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        shell: powershell
        run: ./scripts/Build.ps1
      - name: Check timer, accounting, reminders and desk states
        shell: powershell
        run: |
          $p=Start-Process -FilePath ./artifacts/FocusRelay/FocusRelay.exe -ArgumentList '--smoke-test' -Wait -PassThru
          if($p.ExitCode -ne 0){Get-Content ./artifacts/FocusRelay/data/startup-error.txt -ErrorAction SilentlyContinue; throw 'Smoke test failed'}
          Get-Content ./artifacts/FocusRelay/data/verification.txt
      - name: Package without personal data
        shell: powershell
        run: ./scripts/Package.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: FocusRelay-win-x64
          path: artifacts/FocusRelay-win-x64.zip
